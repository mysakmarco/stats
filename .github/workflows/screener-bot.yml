name: screener-bot
# Серверний скан скрінера: записує сетапи «Вхід зараз» і їх результати
# у гілку screener-data (screener/journal.json), щоб статистика була однакова всюди.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["screener/bot.mjs", ".github/workflows/screener-bot.yml"]
permissions:
  contents: write
concurrency:
  group: screener-bot
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Data branch
        run: |
          if git fetch --depth 1 origin screener-data; then
            git worktree add -B screener-data data FETCH_HEAD
          else
            git worktree add -B screener-data data HEAD
          fi
          mkdir -p data/screener
      - name: Probe exchanges
        run: |
          {
          date -u
          for u in https://api.bybit.com/v5/market/time https://api.bytick.com/v5/market/time https://api.bybitglobal.com/v5/market/time \
                   https://fapi.binance.com/fapi/v1/time https://data-api.binance.vision/api/v3/time \
                   https://www.okx.com/api/v5/public/time https://api.gateio.ws/api/v4/spot/time \
                   https://api-futures.kucoin.com/api/v1/timestamp https://api.bitget.com/api/v2/public/time \
                   https://contract.mexc.com/api/v1/contract/ping https://futures.kraken.com/derivatives/api/v3/tickers \
                   https://api.kraken.com/0/public/Time; do
            echo "$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$u") $u"
          done
          echo "$(curl -s -o /dev/null -m 10 -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"type":"meta"}' https://api.hyperliquid.xyz/info) hyperliquid"
          } > data/screener/probe.txt 2>&1; cat data/screener/probe.txt
      - name: Scan
        run: node screener/bot.mjs data/screener/journal.json data/screener/bot-status.json
      - name: Save
        if: always()
        run: |
          cd data
          git config user.name "screener-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screener/journal.json screener/bot-status.json screener/probe.txt
          git commit -q -m "bot: journal $(date -u +%H:%M)" || exit 0
          for i in 1 2 3 4; do
            git push -q origin HEAD:screener-data && exit 0
            sleep $((i*3))
            git fetch -q --depth 1 origin screener-data
            git show FETCH_HEAD:screener/journal.json > /tmp/remote.json 2>/dev/null || echo '{}' > /tmp/remote.json
            node ../screener/bot.mjs --merge screener/journal.json /tmp/remote.json
            git reset -q --soft FETCH_HEAD
            git add screener/journal.json screener/bot-status.json screener/probe.txt
            git commit -q -m "bot: journal $(date -u +%H:%M)" || exit 0
          done
          exit 1
