name: screener-bot
# Серверний скан скрінера: записує сетапи «Вхід зараз» і їх результати
# у гілку screener-data (screener/journal.json), щоб статистика була однакова всюди.
# GitHub запускає розклад нерегулярно (буває раз на кілька годин), тому один запуск
# крутиться ~5 год 40 хв і сканує кожні 5 хв сам. Наступний запуск стає в чергу
# і стартує, коли попередній закінчиться. Якщо цей файл змінили в main, запущений цикл
# сам завершується, щоб новий запуск (з новими налаштуваннями і секретами) стартував одразу.
# Push-сповіщення: секрет SCREENER_PUSH_KEY (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["screener/bot.mjs", "screener/bot-config.json", ".github/workflows/screener-bot.yml"]
permissions:
  contents: write
concurrency:
  group: screener-bot
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Data branch
        run: |
          if git fetch --depth 1 origin screener-data; then
            git worktree add -B screener-data data FETCH_HEAD
          else
            git worktree add -B screener-data data HEAD
          fi
          mkdir -p data/screener
          cd data
          git config user.name "screener-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Scan loop
        env:
          SCREENER_PUSH_KEY: ${{ secrets.SCREENER_PUSH_KEY }}
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            # свіжий код скрінера з main (зміни підхоплюються без перезапуску)
            git fetch -q --depth 1 origin main && git checkout -q FETCH_HEAD -- screener/ || true
            # змінився сам workflow: виходимо, новий запуск уже в черзі
            if ! git diff --quiet HEAD FETCH_HEAD -- .github/workflows/screener-bot.yml 2>/dev/null; then
              echo "workflow changed in main, handing over to the new run"; break
            fi
            # свіжий журнал (його міг змінити сайт з ключем)
            (cd data && git fetch -q --depth 1 origin screener-data && git reset -q --hard FETCH_HEAD) || true
            mkdir -p data/screener
            timeout 14m node screener/bot.mjs data/screener/journal.json data/screener/bot-status.json || echo "scan failed"
            (
              cd data
              git add screener/journal.json screener/bot-status.json
              if git commit -q -m "bot: journal $(date -u +%H:%M)"; then
                for i in 1 2 3 4; do
                  git push -q origin HEAD:screener-data && break
                  sleep $((i*3))
                  git fetch -q --depth 1 origin screener-data
                  git show FETCH_HEAD:screener/journal.json > /tmp/remote.json 2>/dev/null || echo '{}' > /tmp/remote.json
                  node ../screener/bot.mjs --merge screener/journal.json /tmp/remote.json
                  git reset -q --soft FETCH_HEAD
                  git add screener/journal.json screener/bot-status.json
                  git commit -q -m "bot: journal $(date -u +%H:%M)" || break
                done
              fi
            )
            left=$(( 300 - ($(date +%s) - start) ))
            if [ "$left" -gt 0 ]; then sleep "$left"; fi
          done
